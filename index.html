<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cassino - Crash Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .casino-card {
            background-color: #181c24;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { color: #f2a900; margin-top: 0; font-size: 24px; }
        .balance-box {
            background-color: #1f2531;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2c3547;
        }
        .balance-title { font-size: 14px; color: #90a4ae; margin: 0; text-transform: uppercase; }
        .balance-value { font-size: 28px; font-weight: bold; color: #4caf50; margin: 5px 0 0 0; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #b0bec5; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2c3547;
            background-color: #1f2531;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { border-color: #f2a900; outline: none; }
        button {
            width: 100%;
            padding: 15px;
            background-color: #ffc107;
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:active { background-color: #b78103; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: none;
        }
        .win { background-color: rgba(76, 175, 80, 0.15); color: #4caf50; border: 1px solid #4caf50; }
        .loss { background-color: rgba(244, 67, 54, 0.15); color: #f44336; border: 1px solid #f44336; }
    </style>
</head>
<body>

<div class="casino-card">
    <h2>🎰 Bet Simulator (Demo)</h2>
    <p style="color: #78909c; font-size: 14px; margin-bottom: 20px;">Código demonstrativo para estudo de lógica de probabilidade</p>
    
    <div class="balance-box">
        <p class="balance-title">Saldo Virtual</p>
        <p class="balance-value" id="saldo">R$ 1000.00</p>
    </div>

    <div class="input-group">
        <label for="aposta">Valor da Aposta (R$)</label>
        <input type="number" id="aposta" placeholder="Ex: 50" min="1">
    </div>

    <div class="input-group">
        <label for="alvo">Multiplicador Alvo</label>
        <input type="number" id="alvo" placeholder="Ex: 2.0" step="0.1" min="1.1">
    </div>

    <button onclick="jogar()">Iniciar Rodada</button>

    <div class="result-box" id="resultado"></div>
</div>

<script>
    // Saldo inicial salvo na memória do navegador do usuário
    let saldo = parseFloat(localStorage.getItem('saldo_simulado')) || 1000.00;
    document.getElementById('saldo').innerText = `R$ ${saldo.toFixed(2)}`;

    function jogar() {
        const apostaInput = document.getElementById('aposta');
        const alvoInput = document.getElementById('alvo');
        const resultadoDiv = document.getElementById('resultado');

        const quantiaApostada = parseFloat(apostaInput.value);
        const multiplicadorAlvo = parseFloat(alvoInput.value);

        // Validações básicas
        if (isNaN(quantiaApostada) || quantiaApostada <= 0 || quantiaApostada > saldo) {
            alert("Aposta inválida ou saldo insuficiente!");
            return;
        }
        if (isNaN(multiplicadorAlvo) || multiplicadorAlvo <= 1.0) {
            alert("O multiplicador alvo deve ser maior que 1.0!");
            return;
        }

        // Deduz a aposta do saldo temporariamente
        saldo -= quantiaApostada;

        // Lógica de sorteio (Math.random simula a taxa de sucesso)
        const taxaDeSucesso = Math.random();
        
        // Simulação matemática de um algoritmo com margem da casa (RTP)
        // Quanto maior o multiplicador que o jogador quer buscar, menor a chance dele obter sucesso
        const pontoDeColisao = 1.01 + (1 / (taxaDeSucesso + 0.01)) * 0.95;
        const pontoArredondado = parseFloat(pontoDeColisao.toFixed(2));

        resultadoDiv.style.display = "block";

        if (multiplicadorAlvo <= pontoArredondado) {
            // Vitória
            const lucro = quantiaApostada * multiplicadorAlvo;
            saldo += lucro;
            
            resultadoDiv.className = "result-box win";
            resultadoDiv.innerHTML = `🎉 VITÓRIA!<br>O gráfico subiu até: ${pontoArredondado}x<br>Você retirou em: ${multiplicadorAlvo}x<br>Ganhou: R$ ${lucro.toFixed(2)}`;
        } else {
            // Derrota
            resultadoDiv.className = "result-box loss";
            resultadoDiv.innerHTML = `💥 CRASHOU!<br>O gráfico quebrou em: ${pontoArredondado}x<br>Você tentou buscar: ${multiplicadorAlvo}x`;
        }

        // Atualiza a tela e salva o novo saldo no navegador
        document.getElementById('saldo').innerText = `R$ ${saldo.toFixed(2)}`;
        localStorage.setItem('saldo_simulado', saldo);
    }
</script>

</body>
</html>
